site_name: Peter's Docs
site_description: Documentation for Cinema Booking System
site_author: Peter Gosling
site_url: https://goslingp.github.io/lab_4_cinema_booking/

# Theme configuration
theme:
  name: material
  language: en
  features:
    -  navigation.instant
    -  navigation.sections
    -  navigation.expand
    -  content.code.copy
    -  content.code.annotate
    -  content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: blue
    - scheme: slate
      primary: indigo
      accent: blue

# Navigation Structure
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Running the App: getting-started/running.md
  - Tutorials:
    - Basic Usage: tutorials/basic-usage.md
    - Advance Features: tutorials/advance.md
  - API Reference:
    - Core Module: api/core.md
    - Utils Module: api/utils.md
  - Testing: teting/index.md

# Markdown extensions
markdown_extensions:
  - admonition 
  - toc:
    permalink: true
  - codehilite:
    guess_lang: false
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight
  -  pymdownx.details
  -  pymdownx.snippets
  -  pymdownx.magiclink

# Plugins
plugins:
  - search
  -mkdocstrings:
    handlers:
      python:
        setup_commands:
          - python -m pip install -r requirements.txt
        options:
          docstring_stlye: google
          show_source: true

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
    link: https://github.com/username/lab_4_cinema_booking
    
    
    
